<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b3c">
<meta name="description" content="RK Digital World — नई वेबसाइट जल्द आ रही है।">
<title>RK Digital World | नई वेबसाइट जल्द आ रही है</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(145deg,#08152f,#172b59 55%,#312e81);color:#fff;display:grid;place-items:center;padding:24px}
main{width:min(720px,100%);text-align:center;padding:clamp(28px,7vw,64px) 24px;border:1px solid #ffffff2b;border-radius:28px;background:#ffffff0d;box-shadow:0 24px 80px #02081766;backdrop-filter:blur(12px)}
.logo{width:76px;height:76px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#fbbf24,#f97316);color:#111827;font-size:34px;font-weight:950}
.kicker{font-size:12px;letter-spacing:.18em;font-weight:850;color:#fcd34d}
h1{font-size:clamp(32px,7vw,54px);line-height:1.08;margin:12px 0 14px;font-weight:950}
p{font-size:clamp(15px,2.5vw,18px);line-height:1.8;color:#e0e7ff;margin:0 auto;max-width:540px}
.line{height:4px;width:84px;border-radius:9px;background:linear-gradient(90deg,#fbbf24,#fb7185);margin:26px auto}
small{display:block;color:#c7d2fe;line-height:1.8;font-size:13px}
.contact{margin-top:22px;font-weight:750;color:#fff}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">RK</div>
<div class="kicker">RK DIGITAL WORLD</div>
<h1>हमारी नई वेबसाइट आ रही है</h1>
<p>हम आपके लिए एक बिल्कुल नया और बेहतर डिजिटल अनुभव तैयार कर रहे हैं। नई वेबसाइट जल्द ही उपलब्ध होगी।</p>
<div class="line"></div>
<small>पुरानी वेबसाइट की सेवाएँ फिलहाल बंद कर दी गई हैं।<br>कृपया नई वेबसाइट के लॉन्च तक प्रतीक्षा करें।</small>
<div class="contact">शनिचरी बंगाली कॉलोनी, निमाई चौक, पश्चिम चंपारण, बिहार</div>
</main>
</body>
</html>
